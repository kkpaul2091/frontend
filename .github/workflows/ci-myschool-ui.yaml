  # ── 3. Python Security Scans ──────────────────────────────────────────────
  security:
    name: Python Security
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Bandit source-code scan
        run: |
          bandit \
            --recursive . \
            --exclude ./tests,./.venv,./venv \
            --severity-level high

      - name: Audit Python dependencies
        if: hashFiles('requirements.txt') != ''
        run: pip-audit --requirement requirements.txt

  # ── 4. Validate Python Application ────────────────────────────────────────
  build:
    name: Build and Validate
    runs-on: ubuntu-latest
    needs:
     # - test
      - security

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Compile Python files
        run: |
          python -m compileall \
            -q \
            -x '(^|/)(\.git|\.venv|venv)/' \
            .

      - name: Upload application source
        uses: actions/upload-artifact@v6
        with:
          name: pharma-api-source
          path: |
            .
            !.git/
            !.github/
            !.venv/
            !venv/
            !__pycache__/
            !htmlcov/
          retention-days: 3

  # ── 5. Docker Build, Trivy Scan and Push to Artifact Registry ────────────
  docker-build-push:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: build

    # Pull requests must not push Docker images.
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'

    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      image_uri: ${{ steps.image.outputs.image_uri }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set short image tag
        id: tag
        shell: bash
        run: |
          echo "image_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set Artifact Registry image URI
        id: image
        shell: bash
        run: |
          IMAGE_URI="${GAR_HOSTNAME}/${GOOGLE_PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"

          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "Artifact Registry image: ${IMAGE_URI}"
          echo "Image tag: ${{ steps.tag.outputs.image_tag }}"

      - name: Authenticate to Google Cloud using OIDC
        id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GOOGLE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Login to Google Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_HOSTNAME }}
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Build Docker image
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          docker build \
            --tag "${IMAGE_URI}:${IMAGE_TAG}" \
            --tag "${IMAGE_URI}:latest" \
            .

      - name: Trivy scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.image_uri }}:${{ steps.tag.outputs.image_tag }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload Trivy scan report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trivy-results
          path: trivy-results.sarif
          retention-days: 3
          if-no-files-found: warn

      - name: Push image to Artifact Registry
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          docker push "${IMAGE_URI}:${IMAGE_TAG}"
          docker push "${IMAGE_URI}:latest"

          echo "Pushed image:"
          echo "${IMAGE_URI}:${IMAGE_TAG}"

  # ── 6. Deploy to DEV through GitOps ───────────────────────────────────────
  deploy-dev:
    name: Deploy - DEV
    runs-on: ubuntu-latest
    needs: docker-build-push
    environment: dev

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v5

      - name: Checkout GitOps repository
        uses: actions/checkout@v5
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: _gitops

      - name: Install yq
        run: |
          sudo wget \
            --quiet \
            --output-document=/usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64"

          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: Update image tag only
        env:
          IMAGE_TAG: ${{ needs.docker-build-push.outputs.image_tag }}
          DEPLOYMENT_FILE: _gitops/k8s/myschool/dev/gke-myschool-app.yaml
        run: |
          yq eval '
            .spec.template.spec.containers[0].image |=
            sub(":.*$"; ":" + strenv(IMAGE_TAG))
          ' --inplace "${DEPLOYMENT_FILE}"

          yq eval '.spec.template.spec.containers[0].image' "${DEPLOYMENT_FILE}"
          
