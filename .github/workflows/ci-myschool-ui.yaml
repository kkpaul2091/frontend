name: CI/CD - my-school-api

# Push:
#   develop    -> test, build, push image, deploy to DEV
#   release/** -> test, build, push image, deploy to DEV
#
# Pull requests:
#   lint, unit tests and security checks only
#   no Docker build or deployment
#
# Production promotion:
#   promote-prod-pharma-api.yml using workflow_dispatch

on:
  push:
    branches:
      - develop
      - "release/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build"
        required: false
        default: "develop"

permissions:
  id-token: write
  contents: read
  actions: read
  pull-requests: read

env:
  PYTHON_VERSION: "3.12"

  # GCP configuration
  GOOGLE_PROJECT_ID: ${{ vars.GOOGLE_PROJECT_ID }}
  GAR_LOCATION: australia-southeast2
  GAR_REPOSITORY: my-school-repo
  IMAGE_NAME: mongo-pupil-app

  # Complete Artifact Registry hostname:
  # australia-southeast2-docker.pkg.dev
  GAR_HOSTNAME: australia-southeast2-docker.pkg.dev

  # GitOps repository, for example:
  # MySchool2091/gitops
  GITOPS_REPO: ${{ vars.GITOPS_REPO }}

jobs:
  # ── 1. Python Lint ────────────────────────────────────────────────────────
  lint:
    name: Python Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install ruff

      - name: Run Ruff lint
        run: ruff check .
      - name: Format code
        run: ruff format .
      - name: Check Python formatting
        run: ruff format --check .

  # ── 2. Unit Tests with Coverage ───────────────────────────────────────────
